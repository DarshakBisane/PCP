name: Build PCP Solver Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "desktopApp/**"
      - "settings.gradle.kts"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build Windows EXE installer
        run: gradle --no-daemon --stacktrace --info -p desktopApp packageExe
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PCP-Solver-Windows-EXE
          path: desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 14
